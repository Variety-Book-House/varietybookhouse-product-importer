<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Scan Importer — Review</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a20;
    --panel-2: #1d2129;
    --border: #262b35;
    --border-soft: #20242d;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --faint: #5c6474;
    --accent: #4f8cff;
    --accent-dim: #2c4a80;
    --green: #3fb96b;
    --green-dim: #1e3a2b;
    --amber: #d9a13c;
    --amber-dim: #3a2f17;
    --red: #e0524d;
    --red-dim: #3a201f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 32px 96px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { background: #242936; border-color: #333a48; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 10px 22px;
  }
  button.primary:hover:not(:disabled) { background: #3d7bf0; border-color: #3d7bf0; }
  button.ghost { background: transparent; border-color: var(--border); }
  button.danger { background: var(--red-dim); border-color: #4a2826; color: var(--red); }
  button.danger:hover:not(:disabled) { background: #472523; border-color: var(--red); }
  button.small { padding: 4px 10px; font-size: 12.5px; border-radius: 6px; }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
    justify-content: space-between;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .title h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.2px; }
  .folder {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    color: var(--muted);
    word-break: break-all;
    max-width: 560px;
  }
  .badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--amber);
    background: var(--amber-dim);
    border: 1px solid #5a4620;
    border-radius: 999px;
    padding: 2px 10px;
    vertical-align: 1px;
  }
  .head-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 550;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .pill.ok { color: var(--text); }
  .pill.ok .dot { background: var(--green); }
  .pill.bad { color: var(--red); }
  .pill.bad .dot { background: var(--red); }
  .pill.warn { color: var(--amber); }
  .pill.warn .dot { background: var(--amber); }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab {
    background: transparent;
    border: none;
    border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 9px 14px;
    font-weight: 550;
  }
  .tab:hover { color: var(--text); background: transparent; }
  .tab.is_active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count {
    display: inline-block;
    min-width: 20px;
    text-align: center;
    background: var(--panel-2);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11.5px;
    margin-left: 6px;
    color: var(--muted);
  }
  .tab.is_active .count { background: var(--accent-dim); color: var(--text); }

  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-top {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
  }
  @media (max-width: 900px) {
    .card-top { grid-template-columns: 1fr; }
    .thumbs { flex-direction: row; border-bottom: 1px solid var(--border); }
  }
  .thumbs {
    display: flex;
    gap: 14px;
    padding: 18px;
    background: var(--panel-2);
    border-right: 1px solid var(--border-soft);
    align-items: flex-start;
  }
  .thumb { width: 180px; flex: none; }
  .thumb img {
    width: 180px;
    height: 240px;
    object-fit: contain;
    background: #0b0d10;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: block;
  }
  .thumb .no-cover {
    width: 180px;
    height: 240px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--faint);
    font-size: 12px;
    text-align: center;
    padding: 12px;
  }
  .thumb .pos {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--faint);
    text-align: center;
  }
  .thumb .src-toggle {
    margin-top: 6px;
    width: 100%;
    font-size: 11px;
    padding: 4px 6px;
  }
  .thumb .src-toggle.is_active {
    border-color: var(--warn, #b8860b);
    color: var(--warn, #b8860b);
  }
  .thumb .pos-toggle { display: flex; gap: 4px; justify-content: center; margin-top: 5px; }
  .thumb .pos-btn { font-size: 10px; padding: 2px 8px; border-radius: 999px; }
  .thumb .pos-btn.is_active { border-color: var(--accent); color: var(--accent); background: rgba(79, 140, 255, 0.08); }
  .enrich { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #444; }
  .genres { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .genre-chip {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11px;
    border-radius: 10px;
    border: 1px solid #555;
    color: #bbb;
  }
  .ocr { padding: 18px; min-width: 0; }
  .ocr h2 {
    margin: 0 0 2px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.1px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ocr .author { color: var(--muted); margin-bottom: 12px; }
  .meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px 16px;
    margin-bottom: 12px;
  }
  .meta .k {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--faint);
  }
  .meta .v { font-size: 13.5px; }
  .meta .v .raw { color: var(--faint); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .blurb {
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
  }
  .blurb.expanded { display: block; -webkit-line-clamp: unset; }
  .blurb-hint { font-size: 11px; color: var(--faint); margin-top: 4px; }

  .status-pill {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 2px 10px;
    border: 1px solid;
  }
  .status-pill.matched { color: var(--accent); border-color: var(--accent-dim); background: rgba(79, 140, 255, 0.08); }
  .status-pill.created { color: var(--accent); border-color: var(--accent-dim); background: rgba(79, 140, 255, 0.08); }
  .status-pill.needs_review { color: var(--amber); border-color: #5a4620; background: var(--amber-dim); }
  .status-pill.unmatched { color: var(--muted); border-color: var(--border); background: var(--panel-2); }
  .status-pill.committed { color: var(--green); border-color: #2c5a3e; background: var(--green-dim); }
  .status-pill.failed { color: var(--red); border-color: #4a2826; background: var(--red-dim); }

  .code-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    border-radius: 999px;
    padding: 2px 10px;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    background: rgba(79, 140, 255, 0.08);
    white-space: nowrap;
  }
  .code-badge.unresolved { color: var(--amber); border-color: #5a4620; background: var(--amber-dim); }

  .card-actions {
    padding: 14px 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .action-row .grow { flex: 1; }
  .candidates { display: flex; flex-direction: column; gap: 6px; }
  .candidate {
    display: grid;
    grid-template-columns: 28px 1fr auto auto auto auto;
    gap: 12px;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 9px 12px;
  }
  .candidate.top { border-color: var(--accent-dim); background: rgba(79, 140, 255, 0.06); }
  .candidate.chosen { border-color: var(--green); background: var(--green-dim); }
  .rank {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .candidate.top .rank { color: var(--accent); border-color: var(--accent-dim); }
  .candidate.chosen .rank { color: var(--green); border-color: var(--green); }
  .cand-title { font-weight: 600; font-size: 13.5px; }
  .cand-author { color: var(--muted); font-size: 12.5px; }
  .mrp { font-size: 13px; font-weight: 650; white-space: nowrap; }
  .mrp-match {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--green);
    background: var(--green-dim);
    border: 1px solid #2c5a3e;
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .score { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .create-form {
    display: grid;
    grid-template-columns: 2fr 1.4fr 0.7fr 1.2fr auto;
    gap: 8px;
    align-items: end;
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  @media (max-width: 900px) { .create-form { grid-template-columns: 1fr 1fr; } }
  .create-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--faint); }
  .create-form input {
    font: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
  }
  .create-form input:focus { outline: none; border-color: var(--accent); }

  .create-wrap {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
    background: var(--panel-2);
  }
  .create-wrap > summary.create-label { cursor: pointer; list-style: none; user-select: none; }
  .create-wrap > summary.create-label::-webkit-details-marker { display: none; }
  .create-wrap > summary.create-label::after { content: ' ▸'; color: var(--faint); }
  .create-wrap[open] > summary.create-label::after { content: ' ▾'; }
  .create-wrap[open] > .create-inner { margin-top: 8px; }
  .create-wrap .create-form { border: none; background: transparent; padding: 0; }

  .crop-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .crop-modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; max-width: min(94vw, 880px); max-height: 94vh; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .crop-modal > .crop-bar { width: 100%; }
  .crop-stage { position: relative; display: inline-block; line-height: 0; touch-action: none; user-select: none; }
  .crop-stage img { display: block; max-width: 100%; max-height: 72vh; -webkit-user-drag: none; }
  .crop-rect { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); cursor: move; }
  .crop-handle { position: absolute; width: 14px; height: 14px; background: var(--accent); border: 2px solid #fff; border-radius: 3px; z-index: 2; }
  .crop-handle.nw { left: -9px; top: -9px; cursor: nwse-resize; }
  .crop-handle.ne { right: -9px; top: -9px; cursor: nesw-resize; }
  .crop-handle.sw { left: -9px; bottom: -9px; cursor: nesw-resize; }
  .crop-handle.se { right: -9px; bottom: -9px; cursor: nwse-resize; }
  .crop-bar { display: flex; gap: 8px; align-items: center; line-height: 1.4; }
  .crop-hint { font-size: 12px; color: var(--muted); }

  .search-wrap {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
    background: var(--panel-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-row { display: flex; gap: 8px; }
  .search-row input {
    flex: 1;
    font: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
  }
  .search-row input:focus { outline: none; border-color: var(--accent); }
  .search-results { border: 0; padding: 0; background: transparent; }
  .search-empty { font-size: 12px; color: var(--faint); padding: 6px 2px; }
  .folder-input-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    margin-bottom: 14px;
  }
  .folder-input-row input {
    font: inherit;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    min-width: 0;
  }
  .folder-input-row input:focus { outline: none; border-color: var(--accent); }
  @media (max-width: 700px) { .folder-input-row { grid-template-columns: 1fr; } }
  .create-label { font-size: 12px; font-weight: 650; color: var(--muted); margin: 0 0 8px; }

  .muted-card { opacity: 0.6; }
  .dismissed-note { font-size: 12px; color: var(--faint); }

  .failed-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .failed-item .fname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
  .failed-item .ferr { color: var(--red); font-size: 12.5px; flex: 1; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 56px 24px;
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    color: var(--text);
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 12px; }
  .section-head h3 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: 0.3px; text-transform: uppercase; color: var(--muted); }

  .commit-results {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .commit-results h3 { margin: 0 0 10px; font-size: 14px; }
  .result-row { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; font-size: 13.5px; border-top: 1px solid var(--border-soft); }
  .result-row:first-of-type { border-top: none; }
  .result-row .ok { color: var(--green); font-weight: 700; }
  .result-row .err { color: var(--red); font-weight: 700; }
  .result-row .detail { color: var(--muted); font-size: 12.5px; }

  .spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -2px;
    margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .progress-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .progress-phase { font-weight: 650; font-size: 14px; }
  .progress-count {
    color: var(--muted);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .progress-label {
    color: var(--faint);
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 280px;
  }
  .progress-grow { flex: 1; }
  .progress-x {
    background: transparent;
    border: none;
    color: var(--faint);
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    padding: 0 4px;
  }
  .progress-x:hover { color: var(--text); background: transparent; }
  .progress-bar {
    height: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 10px 0 8px;
  }
  .progress-bar .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.25s ease;
  }
  .progress-bar.done .fill { background: linear-gradient(90deg, var(--green-dim), var(--green)); }
  .progress-bar.busy .fill { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .progress-msg {
    font-size: 12.5px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
    min-height: 19px;
  }
  .progress-events {
    list-style: none;
    margin: 10px 0 0;
    padding: 8px 0 0;
    border-top: 1px solid var(--border-soft);
    max-height: 176px;
    overflow-y: auto;
  }
  .progress-events li {
    font-size: 12.5px;
    color: var(--muted);
    padding: 2px 0;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .progress-events li .mark { color: var(--green); flex: none; font-weight: 700; }
  .progress-events li.error { color: var(--red); }
  .progress-events li.error .mark { color: var(--red); }
  .progress-events .more { color: var(--faint); font-style: italic; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 13px;
    max-width: 420px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    display: none;
    z-index: 50;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Book Scan Importer <span id="dry-run-badge" class="badge" hidden>dry run</span></h1>
      <div class="folder" id="folder">loading…</div>
    </div>
    <div class="head-right">
      <div class="pills">
        <span class="pill" id="pill-ocr"><span class="dot"></span><span>OCR …</span></span>
        <span class="pill" id="pill-db"><span class="dot"></span><span>DB …</span></span>
        <span class="pill" id="pill-r2"><span class="dot"></span><span>R2 …</span></span>
        <span class="pill" id="pill-llm"><span class="dot"></span><span>LLM …</span></span>
      </div>
      <button class="danger" id="btn-stop-job" type="button" hidden>Stop job</button>
      <button class="ghost" id="btn-change-folder" type="button">Select image folder</button>
      <button class="ghost" id="btn-refresh" type="button">Refresh</button>
      <button class="primary" id="btn-commit" type="button">Commit to database</button>
    </div>
  </header>

  <section id="progress" class="progress" hidden>
    <div class="progress-head">
      <span class="spinner" id="progress-spinner"></span>
      <span class="progress-phase" id="progress-phase">Working</span>
      <span class="progress-count" id="progress-count"></span>
      <span class="progress-grow"></span>
      <span class="progress-label" id="progress-label"></span>
      <button class="progress-x" id="progress-dismiss" type="button" title="Hide progress">&times;</button>
    </div>
    <div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div>
    <div class="progress-msg" id="progress-msg"></div>
    <ul class="progress-events" id="progress-events" hidden></ul>
  </section>

  <section id="folder-picker" hidden>
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <div class="section-head">
        <h3>Select folder containing book scans</h3>
      </div>
      <div style="padding: 18px;">
        <div class="folder-input-row">
          <input id="folder-path-input" type="text" placeholder="Paste folder path, e.g. /Users/.../Scans">
          <button class="ghost" id="btn-open-path" type="button">Open path</button>
          <button class="primary" id="btn-start-path" type="button">Process path</button>
        </div>
        <div style="margin-bottom: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--muted); word-break: break-all;" id="browser-path"></div>
        <div id="browser-dirs" style="display: flex; flex-direction: column; gap: 6px;"></div>
        <div id="browser-empty" class="empty" hidden>No subfolders here.</div>
        <div class="action-row" style="margin-top: 16px; justify-content: flex-end;">
          <button class="primary" id="btn-start-here" type="button" hidden>Start processing here</button>
          <button class="ghost" id="btn-go-up" type="button">Go up</button>
        </div>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Book states"></nav>

  <section id="commit-results" class="commit-results" hidden></section>

  <main id="content"><div class="empty">Loading…</div></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var state = null;
  var is_activeTab = 'matched';
  var busy = false;
  var lastUpdated = 0;
  var refreshQueued = false;
  var browserPath = null;
  var choosingFolder = false;
  var progressTimer = null;
  var progressDismissed = false;
  var progressId = null;
  var progressBusy = false;

  var TABS = [
    { id: 'matched', label: 'Matched', match: function (b) { return b.status === 'matched' || b.status === 'created' || b.status === 'committed'; } },
    { id: 'review', label: 'Review', match: function (b) { return b.status === 'needs_review'; } },
    { id: 'unmatched', label: 'Unmatched', match: function (b) { return b.status === 'unmatched'; } },
    { id: 'pending', label: 'Not committed', match: function (b) { return b.status !== 'committed'; } },
    { id: 'committed', label: 'Committed', match: function (b) { return b.status === 'committed'; } },
    { id: 'failed', label: 'Failed', match: null },
    { id: 'all', label: 'All', match: function () { return true; } }
  ];

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') el.textContent = attrs[k];
        else if (k === 'html') el.innerHTML = attrs[k];
        else el.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fmtPrice(v) {
    return v == null ? '—' : '₹' + Number(v).toLocaleString('en-IN');
  }

  function fmtNum(v) {
    return v == null ? '' : String(v);
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 6000);
  }

  function debounceRefresh() {
    if (refreshQueued) return;
    refreshQueued = true;
    setTimeout(function () {
      refreshQueued = false;
      loadState();
    }, 450);
  }

  function fmtDuration(ms) {
    if (ms == null || !isFinite(ms)) return '';
    var sec = Math.max(0, Math.round(ms / 1000));
    if (sec < 60) return sec + 's';
    var min = Math.floor(sec / 60);
    var rem = sec % 60;
    if (min < 60) return min + 'm ' + rem + 's';
    return Math.floor(min / 60) + 'h ' + (min % 60) + 'm';
  }

  function renderProgress(p) {
    var box = document.getElementById('progress');
    if (!p || progressDismissed) {
      box.hidden = true;
      progressId = p ? p.id : null;
      return;
    }
    box.hidden = false;
    if (progressId !== p.id) {
      progressId = p.id;
      document.getElementById('progress-events').innerHTML = '';
    }

    var indeterminate = p.fraction == null && !p.done;
    document.getElementById('progress-spinner').style.display = p.done ? 'none' : '';
    document.getElementById('progress-phase').textContent = p.done ? 'Finished' : p.phaseLabel;

    var bits = [];
    if (p.total > 0) bits.push(p.current + '/' + p.total);
    bits.push(p.succeeded + ' ok');
    if (p.failed) bits.push(p.failed + ' failed');
    if (p.done) bits.push('took ' + fmtDuration(p.elapsedMs));
    else if (p.etaMs != null) bits.push('eta ' + fmtDuration(p.etaMs));
    document.getElementById('progress-count').textContent = bits.join('  ·  ');

    document.getElementById('progress-label').textContent = p.label || '';

    var bar = document.getElementById('progress-bar');
    bar.className = 'progress-bar' + (p.done ? ' done' : indeterminate ? ' busy' : '');
    var pct = indeterminate ? 100 : Math.round((p.fraction != null ? p.fraction : p.overallFraction || 0) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';

    var msg = p.done && p.summary ? p.summary : p.message;
    document.getElementById('progress-msg').textContent = msg || '';

    var ev = document.getElementById('progress-events');
    var events = p.events || [];
    if (events.length === 0) {
      ev.hidden = true;
      return;
    }
    ev.hidden = false;
    ev.innerHTML = '';
    var shown = events.slice(-12).reverse();
    shown.forEach(function (e) {
      ev.appendChild(h('li', { class: e.level === 'error' ? 'error' : '' }, [
        h('span', { class: 'mark', text: e.level === 'error' ? '✗' : '✓' }),
        h('span', { text: e.message })
      ]));
    });
    if (events.length > shown.length) {
      ev.appendChild(h('li', { class: 'more', text: '+' + (events.length - shown.length) + ' earlier' }));
    }
  }

  function stopProgressPolling() {
    if (progressTimer) {
      clearInterval(progressTimer);
      progressTimer = null;
    }
    progressBusy = false;
  }

  async function pollProgress() {
    try {
      var data = await api('/api/progress');
      progressBusy = Boolean(data.progress && !data.progress.done);
      renderProgress(data.progress);
    } catch (e) {
      if (!progressTimer) progressBusy = false;
    }
  }

  function startProgressPolling() {
    stopProgressPolling();
    progressDismissed = false;
    pollProgress();
    progressTimer = setInterval(pollProgress, 400);
  }

  function finishProgressPolling() {
    stopProgressPolling();
    setTimeout(pollProgress, 300);
  }

  async function api(path, opts) {
    var res = await fetch(path, opts);
    var data;
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) {
      var err = new Error(data.error || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function loadState() {
    try {
      state = await api('/api/state');
      state.bySha = {};
      (state.images || []).forEach(function (im) {
        if (im && im.sha) state.bySha[im.sha] = im;
      });
      lastUpdated = Date.now();
      if (state.folder && !choosingFolder) {
        document.getElementById('folder-picker').hidden = true;
        render();
      } else {
        document.getElementById('folder-picker').hidden = false;
        initBrowser(browserPath || '/Users/pratulwadhwa/Documents/Workspace/VarietyBookHouse');
        render();
      }
    } catch (e) {
      var el2 = document.getElementById('content');
      el2.innerHTML = '';
      el2.appendChild(h('div', { class: 'empty' }, [
        h('div', { text: 'Could not load state: ' + e.message }),
        h('div', { text: 'Check that the importer is running, then press Refresh.' })
      ]));
    }
  }

  async function initBrowser(startPath) {
    browserPath = startPath;
    document.getElementById('browser-path').textContent = browserPath;
    document.getElementById('folder-path-input').value = browserPath;
    document.getElementById('btn-go-up').hidden = browserPath === pathRoot();
    try {
      var data = await api('/api/browse?path=' + encodeURIComponent(browserPath));
      renderBrowser(data);
    } catch (e) {
      toast('Failed to browse: ' + e.message);
    }
  }

  function pathRoot() {
    return '/';
  }

  function pathDirname(p) {
    var i = p.lastIndexOf('/');
    return i > 0 ? p.substring(0, i) : '/';
  }

  function renderBrowser(data) {
    var container = document.getElementById('browser-dirs');
    container.innerHTML = '';
    var empty = document.getElementById('browser-empty');
    var startBtn = document.getElementById('btn-start-here');

    startBtn.hidden = !data.hasImages;
    if (data.dirs.length === 0) {
      empty.hidden = false;
      if (data.hasImages) empty.textContent = 'This folder has images. Click "Start processing here".';
      else empty.textContent = 'No subfolders or images here.';
    } else {
      empty.hidden = true;
      data.dirs.forEach(function(dir) {
        var btn = h('button', {
          class: 'ghost',
          type: 'button',
          style: 'width: 100%; text-align: left; justify-content: space-between;',
          text: dir.name + ' '
        });
        var span = h('span', { style: 'color: var(--faint);', text: dir.path });
        btn.appendChild(span);
        btn.addEventListener('click', function() { initBrowser(dir.path); });
        container.appendChild(btn);
      });
    }

    startBtn.onclick = function() { startJob(browserPath); };
  document.getElementById('btn-stop-job').onclick = stopJob;
  }

  async function startJob(folder) {
    var btn = document.getElementById('btn-start-here');
    btn.disabled = true;
    btn.textContent = 'Starting…';
    progressId = null;
    startProgressPolling();
    try {
      await api('/api/start-job', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder: folder })
      });
      choosingFolder = false;
      toast('Job started, loading…');
      loadState();
    } catch (e) {
      toast('Failed to start job: ' + e.message);
      btn.disabled = false;
      btn.textContent = 'Start processing here';
    } finally {
      finishProgressPolling();
    }
  }

  async function stopJob() {
    var btn = document.getElementById('btn-stop-job');
    btn.textContent = 'Stopping…';
    try {
      await api('/api/stop-job', { method: 'POST' });
      toast('Job stopped');
      btn.hidden = true;
      document.getElementById('btn-start-here').disabled = false;
    } catch (e) {
      toast('Failed to stop job: ' + e.message);
    }
  }

  function setPill(id, ok, label, warn) {
    var pill = document.getElementById(id);
    var dot = pill.querySelector('.dot');
    pill.className = 'pill ' + (ok ? 'ok' : warn ? 'warn' : 'bad');
    pill.children[1].textContent = label;
    void dot;
  }

  function counts() {
    var books = state ? state.books : [];
    var failed = state ? state.images.filter(function (i) { return i.status === 'failed'; }).length : 0;
    var c = { matched: 0, review: 0, unmatched: 0, pending: 0, committed: 0, all: books.length, failed: failed };
    books.forEach(function (b) {
      if (b.status === 'matched' || b.status === 'created' || b.status === 'committed') c.matched++;
      if (b.status === 'needs_review') c.review++;
      if (b.status === 'unmatched') c.unmatched++;
      if (b.status === 'committed') c.committed++; else c.pending++;
    });
    return c;
  }

  function committable() {
    if (!state) return [];
    return state.books.filter(function (b) {
      return (b.chosenProductId || b.createdProductId) && b.status !== 'committed' && !b.dismissed;
    });
  }

  function renderHeader() {
    document.getElementById('folder').textContent = state.folder || 'unknown folder';
    document.getElementById('dry-run-badge').hidden = !state.dryRun;

    var ocrOk = !!(state.ocr && state.ocr.ok);
    setPill('pill-ocr', ocrOk, ocrOk ? 'OCR ready' : 'OCR tools missing', true);
    setPill('pill-db', !!state.db.ok, state.db.ok ? 'DB ok' : 'DB down', false);
    setPill('pill-r2', !!state.r2.ok, state.r2.ok ? 'R2 ok' : 'R2 missing', true);

    var llm = state.llm || {};
    var llmOk = !!llm.ok;
    var llmLabel = llmOk
      ? 'LLM ready · ' + (llm.model || state.enrichModel || '?') + (llm.hasModel === false ? ' (not pulled)' : '')
      : 'LLM offline (enrich falls back)';
    setPill('pill-llm', llmOk, llmLabel, true);

    var n = committable().length;
    var btn = document.getElementById('btn-commit');
    btn.disabled = busy || state.dryRun || n === 0;
    btn.textContent = state.dryRun
      ? 'Commit disabled (dry run)'
      : n > 0
        ? 'Commit to database (' + n + ')'
        : 'Commit to database';
  }

  function renderTabs() {
    var c = counts();
    var nav = document.getElementById('tabs');
    nav.innerHTML = '';
    TABS.forEach(function (t) {
      var n = t.id === 'failed' ? c.failed : c[t.id];
      var tab = h('button', {
        class: 'tab' + (is_activeTab === t.id ? ' is_active' : ''),
        type: 'button'
      }, [
        t.label,
        h('span', { class: 'count', text: String(n) })
      ]);
      tab.addEventListener('click', function () {
        is_activeTab = t.id;
        renderTabs();
        renderContent();
      });
      nav.appendChild(tab);
    });
  }

  function emptyMessage(tab) {
    var box = h('div', { class: 'empty' });
    if (tab === 'failed') {
      box.appendChild(h('div', { text: 'No failed images. Everything processed cleanly.' }));
      return box;
    }
    box.appendChild(h('div', { text: 'No books in this tab.' }));
    if (state && state.folder) {
      var btn = h('button', { class: 'primary', type: 'button', text: 'Process this folder' });
      btn.addEventListener('click', function () { startJob(state.folder); });
      box.appendChild(h('div', { text: 'Or process the folder via UI:' }));
      box.appendChild(btn);
    } else {
      box.appendChild(h('div', { text: 'Run the pipeline first: ' }));
      var line = h('div', {}, []);
      line.appendChild(h('code', { text: 'node src/run.mjs <folder>' }));
      box.appendChild(line);
    }
    return box;
  }

  function priceTextFor(book) {
    var imgs = state.bySha || {};
    var front = book.front ? imgs[book.front] : null;
    var back = book.back ? imgs[book.back] : null;
    return (front && front.ocr && front.ocr.priceText) || (back && back.ocr && back.ocr.priceText) || '';
  }

  function positionFor(book, which) {
    var imgs = state.bySha || {};
    var img = which === 'front' ? (book.front ? imgs[book.front] : null) : (book.back ? imgs[book.back] : null);
    if (img && img.positionOverride) return img.positionOverride;
    if (img && img.ocr && img.ocr.position) return img.ocr.position;
    return which;
  }

  function statusPill(status) {
    var label = status === 'needs_review' ? 'review' : status;
    return h('span', { class: 'status-pill ' + status, text: label });
  }

  function thumbnail(book, which) {
    var sha = which === 'front' ? book.front : book.back;
    var imgs = state.bySha || {};
    var entry = sha ? imgs[sha] : null;
    var fig = h('div', { class: 'thumb' });
    if (sha) {
      var src = '/img/' + sha + (entry && entry.useOriginal ? '?src=orig' : '');
      if (entry && !entry.useOriginal && cropVersion[sha]) src += '?v=' + cropVersion[sha];
      var img = h('img', { src: src, alt: which + ' cover of ' + book.title, loading: 'lazy' });
      img.addEventListener('error', function () {
        img.outerHTML = '<div class="no-cover">image unavailable</div>';
      });
      fig.appendChild(img);
      var usingOriginal = !!(entry && entry.useOriginal);
      var toggle = h('button', {
        class: 'small src-toggle' + (usingOriginal ? ' is_active' : ''),
        type: 'button',
        text: usingOriginal ? 'Using original ✓' : 'Use original'
      });
      toggle.addEventListener('click', function () {
        var next = !usingOriginal;
        toggle.disabled = true;
        api('/api/image/' + sha + '/source', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: next ? 'original' : 'crop' })
        }).then(function () {
          var live = (state.bySha || {})[sha] || entry;
          if (live) live.useOriginal = next;
          render();
        }).catch(function (e) {
          toggle.disabled = false;
          alert('could not switch image: ' + e.message);
        });
      });
      fig.appendChild(toggle);
      if (entry) {
        var cropBtn = h('button', {
          class: 'small src-toggle' + (entry.manualCrop ? ' is_active' : ''),
          type: 'button',
          text: entry.manualCrop ? 'Cropped ✓ edit' : 'Crop ✂'
        });
        cropBtn.addEventListener('click', function () { openCropModal(sha); });
        fig.appendChild(cropBtn);
      }
    } else {
      fig.appendChild(h('div', { class: 'no-cover', text: 'no back cover' }));
    }
    var code = entry && entry.barcode && entry.barcode.shopCode ? ' · ' + entry.barcode.shopCode : '';
    fig.appendChild(h('div', { class: 'pos', text: positionFor(book, which) + code }));
    if (entry) {
      var effPos = entry.positionOverride || (entry.ocr && entry.ocr.position) || which;
      var posWrap = h('div', { class: 'pos-toggle' });
      ['front', 'back'].forEach(function (role) {
        var b = h('button', {
          class: 'small pos-btn' + (effPos === role ? ' is_active' : ''),
          type: 'button',
          text: role
        });
        b.addEventListener('click', function () { setPosition(sha, role); });
        posWrap.appendChild(b);
      });
      if (entry.positionOverride) {
        var a = h('button', { class: 'small pos-btn auto', type: 'button', text: 'auto ↺' });
        a.addEventListener('click', function () { setPosition(sha, 'auto'); });
        posWrap.appendChild(a);
      }
      fig.appendChild(posWrap);
      if (entry.splitKey || (book.front && book.back)) {
        var splitWrap = h('div', { class: 'pos-toggle' });
        var sb;
        if (entry.splitKey) {
          sb = h('button', { class: 'small pos-btn', type: 'button', text: 'merge ↩' });
          sb.addEventListener('click', function () { splitBook(sha, 'merge'); });
        } else {
          sb = h('button', { class: 'small pos-btn', type: 'button', text: '⤳ another book' });
          sb.addEventListener('click', function () { splitBook(sha, 'out'); });
        }
        splitWrap.appendChild(sb);
        fig.appendChild(splitWrap);
      }
    }
    return fig;
  }

  function setPosition(sha, position) {
    api('/api/image/' + sha + '/position', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ position: position })
    }).then(function () {
      return loadState();
    }).catch(function (e) {
      alert('could not change position: ' + e.message);
    });
  }

  function splitBook(sha, action) {
    api('/api/image/' + sha + '/split', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action })
    }).then(function () {
      return loadState();
    }).catch(function (e) {
      alert('could not ' + action + ': ' + e.message);
    });
  }

  var cropVersion = {};

  function openCropModal(sha) {
    var imgs = state.bySha || {};
    var entry = imgs[sha];
    if (!entry) return;
    var clamp = function (v, lo, hi) { return Math.min(Math.max(v, lo), hi); };
    var box = entry.manualCrop
      ? { x0: entry.manualCrop.x0, y0: entry.manualCrop.y0, x1: entry.manualCrop.x1, y1: entry.manualCrop.y1 }
      : { x0: 0.03, y0: 0.03, x1: 0.97, y1: 0.97 };

    var overlay = h('div', { class: 'crop-overlay' });
    var modal = h('div', { class: 'crop-modal' });
    var stage = h('div', { class: 'crop-stage' });
    var img = h('img', { src: '/img/' + sha + '?src=orig', alt: 'crop target ' + (entry.file || sha) });
    img.draggable = false;
    var rect = h('div', { class: 'crop-rect' });
    var handles = {};
    ['nw', 'ne', 'sw', 'se'].forEach(function (k) {
      handles[k] = h('div', { class: 'crop-handle ' + k });
      rect.appendChild(handles[k]);
    });
    stage.appendChild(img);
    stage.appendChild(rect);

    function layout() {
      rect.style.left = (box.x0 * 100) + '%';
      rect.style.top = (box.y0 * 100) + '%';
      rect.style.width = ((box.x1 - box.x0) * 100) + '%';
      rect.style.height = ((box.y1 - box.y0) * 100) + '%';
    }
    layout();

    var MIN = 0.02;
    var drag = null;
    stage.addEventListener('pointerdown', function (e) {
      var mode = null;
      for (var k in handles) { if (e.target === handles[k]) { mode = k; break; } }
      if (!mode && e.target === rect) mode = 'move';
      if (!mode) return;
      e.preventDefault();
      drag = mode === 'move'
        ? { mode: mode, sx: e.clientX, sy: e.clientY, box: { x0: box.x0, y0: box.y0, x1: box.x1, y1: box.y1 } }
        : { mode: mode };
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var r = img.getBoundingClientRect();
      if (!r.width || !r.height) return;
      if (drag.mode === 'move') {
        var w = drag.box.x1 - drag.box.x0, ht = drag.box.y1 - drag.box.y0;
        var x0 = clamp(drag.box.x0 + (e.clientX - drag.sx) / r.width, 0, 1 - w);
        var y0 = clamp(drag.box.y0 + (e.clientY - drag.sy) / r.height, 0, 1 - ht);
        box.x0 = x0; box.y0 = y0; box.x1 = x0 + w; box.y1 = y0 + ht;
      } else {
        var x = clamp((e.clientX - r.left) / r.width, 0, 1);
        var y = clamp((e.clientY - r.top) / r.height, 0, 1);
        if (drag.mode.indexOf('w') >= 0) box.x0 = Math.min(x, box.x1 - MIN);
        if (drag.mode.indexOf('e') >= 0) box.x1 = Math.max(x, box.x0 + MIN);
        if (drag.mode.indexOf('n') >= 0) box.y0 = Math.min(y, box.y1 - MIN);
        if (drag.mode.indexOf('s') >= 0) box.y1 = Math.max(y, box.y0 + MIN);
      }
      layout();
    });
    ['pointerup', 'pointercancel'].forEach(function (ev) {
      stage.addEventListener(ev, function () { drag = null; });
    });

    var bar = h('div', { class: 'crop-bar' });
    bar.appendChild(h('div', { class: 'crop-hint', text: 'drag the corners or the box — straight crop only, no deskew' }));
    bar.appendChild(h('span', { class: 'grow' }));
    var closeBtn = h('button', { class: 'small', type: 'button', text: 'Cancel' });
    var saveBtn = h('button', { class: 'small', type: 'button', text: 'Apply crop' });
    bar.appendChild(closeBtn);
    if (entry.manualCrop) {
      var resetBtn = h('button', { class: 'danger small', type: 'button', text: 'Reset to auto crop' });
      resetBtn.addEventListener('click', function () {
        resetBtn.disabled = true;
        api('/api/image/' + sha + '/crop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset: true })
        }).then(function (res) {
          entry.manualCrop = null;
          cropVersion[sha] = res.v || Date.now();
          close();
          render();
        }).catch(function (e) {
          resetBtn.disabled = false;
          alert('reset failed: ' + e.message);
        });
      });
      bar.appendChild(resetBtn);
    }
    bar.appendChild(saveBtn);

    function close() {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('pointerdown', function (e) { if (e.target === overlay) close(); });
    closeBtn.addEventListener('click', close);
    saveBtn.addEventListener('click', function () {
      saveBtn.disabled = true;
      api('/api/image/' + sha + '/crop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x0: box.x0, y0: box.y0, x1: box.x1, y1: box.y1 })
      }).then(function (res) {
        var live = (state.bySha || {})[sha] || entry;
        if (live) {
          live.manualCrop = res.manualCrop;
          if (res.dims) live.dims = res.dims;
        }
        cropVersion[sha] = res.v || Date.now();
        close();
        render();
      }).catch(function (e) {
        saveBtn.disabled = false;
        alert('crop failed: ' + e.message);
      });
    });

    modal.appendChild(h('div', { class: 'create-label', text: 'Crop ' + (entry.file || sha) }));
    modal.appendChild(stage);
    modal.appendChild(bar);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  function candidateRow(book, cand, rank) {
    var chosen = book.chosenProductId === cand.id;
    var row = h('div', {
      class: 'candidate' + (rank === 1 ? ' top' : '') + (chosen ? ' chosen' : '')
    });
    row.appendChild(h('div', { class: 'rank', text: String(rank) }));
    var info = h('div', {}, [
      h('div', { class: 'cand-title', text: cand.title || '(untitled)' }),
      h('div', { class: 'cand-author', text: cand.author ? '— ' + cand.author : '' })
    ]);
    row.appendChild(info);
    row.appendChild(h('div', { class: 'mrp', text: fmtPrice(cand.mrp) }));
    if (cand.mrpMatch) row.appendChild(h('div', { class: 'mrp-match', text: 'MRP-MATCH' }));
    else row.appendChild(h('div', { class: 'score', text: 'score ' + cand.score }));
    if (cand.swapped) row.appendChild(h('div', { class: 'mrp-match', text: 'TITLE/AUTHOR SWAPPED' }));
    var action;
    if (chosen) {
      action = h('span', { class: 'status-pill committed', text: 'chosen' });
    } else {
      action = h('button', { class: 'small', type: 'button', text: 'Pick' });

        pickCandidate(book, cand);
      });

  function candidatesSection(book) {
    var wrap = h('div', {}, []);
    wrap.appendChild(h('div', { class: 'create-label', text: 'Candidates' }));
    var list = h('div', { class: 'candidates' });
    book.candidates.slice(0, 5).forEach(function (cand, i) {
      list.appendChild(candidateRow(book, cand, i + 1));
    });
    wrap.appendChild(list);
    return wrap;
  }

  var searchStore = {};

  function searchSection(book) {
    var st = searchStore[book.key] || (searchStore[book.key] = { q: '', results: null, loading: false, error: '' });
    var wrap = h('div', { class: 'search-wrap' });
    wrap.appendChild(h('div', { class: 'create-label', text: 'Search catalogue' }));
    var row = h('div', { class: 'search-row' });
    var input = h('input', { type: 'text', placeholder: 'title, author or ISBN', value: st.q });
    input.addEventListener('input', function () { st.q = input.value; });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); run(); } });
    var btn = h('button', { class: 'small', type: 'button', text: st.loading ? 'Searching…' : 'Search' });
    btn.disabled = st.loading;
    btn.addEventListener('click', run);
    row.appendChild(input);
    row.appendChild(btn);
    wrap.appendChild(row);
    var list = h('div', { class: 'candidates search-results' });
    if (st.error) list.appendChild(h('div', { class: 'search-empty', text: st.error }));
    else if (st.results) {
      if (!st.results.length) list.appendChild(h('div', { class: 'search-empty', text: 'no catalogue matches' }));
      st.results.forEach(function (prod) { list.appendChild(searchResultRow(book, prod)); });
    }
    wrap.appendChild(list);
    return wrap;

    function run() {
      var q = st.q.trim();
      if (q.length < 2) return;
      st.loading = true;
      st.error = '';
      render();
      api('/api/search?q=' + encodeURIComponent(q)).then(function (res) {
        st.results = (res && res.products) || [];
      }).catch(function (e) {
        st.error = 'search failed: ' + e.message;
      }).finally(function () {
        st.loading = false;
        render();
      });
    }
  }

  function searchResultRow(book, cand) {
    var chosen = book.chosenProductId === cand.id;
    var row = h('div', { class: 'candidate' });
    var info = h('div', {}, [
      h('div', { class: 'cand-title', text: cand.title || '(untitled)' }),
      h('div', { class: 'cand-author', text: cand.author ? '— ' + cand.author : '' }),
      h('div', { class: 'cand-author', text: cand.isbn ? 'ISBN ' + cand.isbn : '' })
    ]);
    row.appendChild(info);
    row.appendChild(h('div', { class: 'mrp', text: fmtPrice(cand.mrp) }));

  var createStore = {};
  var createFocus = null;

  function createSection(book) {
    // default open when there's nothing to pick from; remember the user's toggle across re-renders
    var autoOpen = !book.candidates || book.candidates.length === 0 || book.status === 'unmatched';
    var st = createStore[book.key] || (createStore[book.key] = { open: autoOpen });
    var wrap = h('details', { class: 'create-wrap', 'data-book-key': book.key });
    if (st.open) wrap.setAttribute('open', '');
    wrap.appendChild(h('summary', { class: 'create-label', text: 'Create new product' }));
    var inner = h('div', { class: 'create-inner' });
    inner.appendChild(createForm(book, st));
    wrap.appendChild(inner);
    wrap.addEventListener('toggle', function () { st.open = wrap.open; });
    return wrap;
  }

  function createForm(book, st) {
    st.draft = st.draft || {};
    var form = h('form', { class: 'create-form' });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      createProduct(book, form);
    });
    function field(name, value, ph) {
      var v = Object.prototype.hasOwnProperty.call(st.draft, name)
        ? st.draft[name]
        : (value == null ? '' : String(value));
      var input = h('input', { name: name, type: 'text', value: v, placeholder: ph || '' });
      input.addEventListener('input', function () { st.draft[name] = input.value; });
      input.addEventListener('focus', function () { createFocus = { key: book.key, name: name }; });
      input.addEventListener('blur', function (e) {
        var to = e.relatedTarget;
        if (!(to && to.tagName === 'INPUT' && to.closest('form') === form)) createFocus = null;
      });
      return h('label', {}, [h('span', { text: name }), input]);
    }
    form.appendChild(field('title', book.title, 'Book title'));
    form.appendChild(field('author', book.author, 'Author'));
    form.appendChild(field('mrp', book.price, 'MRP in ₹'));
    form.appendChild(field('isbn', book.isbn, 'ISBN'));
    var btn = h('button', { type: 'submit', text: busy ? 'Creating…' : 'Create & use' });
    btn.disabled = busy;
    form.appendChild(btn);
    return form;
  }

  function bookCard(book) {
    var card = h('article', { class: 'card' + (book.dismissed ? ' muted-card' : '') });

    var top = h('div', { class: 'card-top' });
    var thumbs = h('div', { class: 'thumbs' });
    thumbs.appendChild(thumbnail(book, 'front'));
    thumbs.appendChild(thumbnail(book, 'back'));
    top.appendChild(thumbs);

    var ocr = h('div', { class: 'ocr' });
    var title = h('div', {}, []);
    var h2 = h('h2');
    h2.appendChild(h('span', { text: book.title || '(untitled)' }));
    h2.appendChild(statusPill(book.status));
    if (book.shopCode) h2.appendChild(h('span', {
      class: 'code-badge' + (book.shopCodeUnresolved ? ' unresolved' : ''),
      text: 'CODE ' + book.shopCode + (book.shopCodeUnresolved ? ' · not in csv' : '')
    }));
    if (book.score) h2.appendChild(h('span', { class: 'score', text: 'score ' + book.score }));
    title.appendChild(h2);
    ocr.appendChild(title);
    ocr.appendChild(h('div', { class: 'author', text: book.author || '' }));

    var meta = h('div', { class: 'meta' });
    var priceCell = h('div', {}, [
      h('div', { class: 'k', text: 'Price' }),
      h('div', { class: 'v' })
    ]);
    priceCell.children[1].appendChild(h('span', { text: fmtPrice(book.price) }));
    var raw = priceTextFor(book);
    if (raw) priceCell.children[1].appendChild(h('span', { class: 'raw', text: '  (' + raw + ')' }));
    meta.appendChild(priceCell);
    meta.appendChild(h('div', {}, [
      h('div', { class: 'k', text: 'ISBN' }),
      h('div', { class: 'v', text: book.isbn || '—' })
    ]));
    if (book.chosenProductId) meta.appendChild(h('div', {}, [
      h('div', { class: 'k', text: 'Matched product' }),
      h('div', { class: 'v', text: book.chosenProductId })
    ]));
    if (book.createdProductId) meta.appendChild(h('div', {}, [
      h('div', { class: 'k', text: 'Created product' }),
      h('div', { class: 'v', text: book.createdProductId })
    ]));
    ocr.appendChild(meta);

    if (book.blurb) {
      var p = h('p', { class: 'blurb', text: book.blurb });
      p.addEventListener('click', function () { p.classList.toggle('expanded'); });
      ocr.appendChild(p);
      ocr.appendChild(h('div', { class: 'blurb-hint', text: 'click to expand' }));
    }

    if (book.enrich && !book.enrich.error) {
      var emeta = book.enrich;
      var enrichBox = h('div', { class: 'enrich' });
      enrichBox.appendChild(h('span', { class: 'status-pill ' + (emeta.provider || 'none'), text: emeta.provider || 'meta' }));
      var details = [];
      if (emeta.authors && emeta.authors.length) details.push(emeta.authors.join(', '));
      details.push([emeta.publisher, emeta.year, emeta.pageCount ? emeta.pageCount + ' pp' : ''].filter(Boolean).join(' · '));
      if (details.filter(Boolean).length) {
        enrichBox.appendChild(h('div', { class: 'author', text: details.filter(Boolean).join(' — ') }));
      }
      if (emeta.genres && emeta.genres.length) {
        var gwrap = h('div', { class: 'genres' });
        emeta.genres.forEach(function (g) { gwrap.appendChild(h('span', { class: 'genre-chip', text: g })); });
        enrichBox.appendChild(gwrap);
      }
      if (emeta.description) {
        var edesc = h('p', { class: 'blurb', text: emeta.description });
        edesc.addEventListener('click', function () { edesc.classList.toggle('expanded'); });
        enrichBox.appendChild(edesc);
        var eSource = emeta.descriptionSource === 'generated'
          ? 'description generated by ' + (emeta.descriptionModel || 'LLM')
          : emeta.descriptionSource === 'provider'
            ? 'description from provider'
            : '';
        if (eSource) enrichBox.appendChild(h('div', { class: 'blurb-hint', text: eSource }));
      } else {
        enrichBox.appendChild(h('div', { class: 'author', text: 'no description available' }));
      }
      ocr.appendChild(enrichBox);
    }
    top.appendChild(ocr);
    card.appendChild(top);

    var actions = h('div', { class: 'card-actions' });

    if (book.status === 'committed' && book.urls) {
      var urls = book.urls;
      var links = h('div', { class: 'action-row' });
      links.appendChild(h('span', { class: 'status-pill committed', text: 'in database' }));
      if (urls.frontCard) links.appendChild(h('a', { href: urls.frontCard, target: '_blank', rel: 'noopener', text: 'front card' }));
      if (urls.frontDetail) links.appendChild(h('a', { href: urls.frontDetail, target: '_blank', rel: 'noopener', text: 'front detail' }));
      if (urls.backCard) links.appendChild(h('a', { href: urls.backCard, target: '_blank', rel: 'noopener', text: 'back card' }));
      if (urls.backDetail) links.appendChild(h('a', { href: urls.backDetail, target: '_blank', rel: 'noopener', text: 'back detail' }));
      actions.appendChild(links);
    }

    if (book.status !== 'committed' && !book.dismissed) {
      if (book.candidates && book.candidates.length > 0) actions.appendChild(candidatesSection(book));
      actions.appendChild(searchSection(book));
      actions.appendChild(createSection(book));
      var row = h('div', { class: 'action-row' });
      if (book.isbn && (!book.enrich || book.enrich.error || !book.enrich.description)) {
        var enrichBtn = h('button', { class: 'small', type: 'button', text: busy ? 'Enriching…' : 'Enrich from ISBN' });
        enrichBtn.disabled = busy;
        enrichBtn.addEventListener('click', function () {
          withBusy(async function () {
            var key = encodeURIComponent(book.key);
            await api('/api/book/' + key + '/enrich', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({})
            });
          });
        });
        row.appendChild(enrichBtn);
        if (book.enrich && book.enrich.error) {
          row.appendChild(h('span', { class: 'dismissed-note', text: book.enrich.error }));
        }
      }
      if (book.matchReason) row.appendChild(h('span', { class: 'dismissed-note', text: book.matchReason }));
      row.appendChild(h('span', { class: 'grow' }));
      var reject = h('button', { class: 'danger small', type: 'button', text: 'Reject' });
      reject.addEventListener('click', function () { dismiss(book); });
      row.appendChild(reject);
      actions.appendChild(row);
    }

    if (book.dismissed) {
      var drow = h('div', { class: 'action-row' });
      drow.appendChild(h('span', { class: 'dismissed-note', text: 'Dismissed — hidden from commit.' }));
      drow.appendChild(h('span', { class: 'grow' }));
      var undo = h('button', { class: 'small', type: 'button', text: 'Undo dismiss' });
      undo.addEventListener('click', function () { undoDismiss(book); });
      drow.appendChild(undo);
      actions.appendChild(drow);
    }

    if (book.commitError) {
      actions.appendChild(h('div', { class: 'dismissed-note', text: 'Commit error: ' + book.commitError, style: 'color: var(--red);' }));
    }

    card.appendChild(actions);
    return card;
  }

  function renderContent() {
    var box = document.getElementById('content');
    box.innerHTML = '';
    if (!state) return;

    if (is_activeTab === 'failed') {
      var failed = state.images.filter(function (i) { return i.status === 'failed'; });
      if (failed.length === 0) {
        box.appendChild(emptyMessage('failed'));
        return;
      }
      var head = h('div', { class: 'section-head' }, [
        h('h3', { text: 'Failed images (' + failed.length + ')' })
      ]);
      var retry = h('button', { type: 'button', text: busy ? 'Retrying…' : 'Retry all' });
      retry.disabled = busy;
      retry.addEventListener('click', retryFailed);
      head.appendChild(retry);
      box.appendChild(head);
      var list = h('div', { class: 'cards' });
      failed.forEach(function (img) {
        list.appendChild(h('div', { class: 'failed-item' }, [
          h('span', { class: 'fname', text: img.file || img.sha }),
          h('span', { class: 'ferr', text: img.error || 'unknown error' }),
          h('span', { class: 'score', text: img.sha ? img.sha.slice(0, 12) : '' })
        ]));
      });
      box.appendChild(list);
      return;
    }

    var tab = TABS.find(function (t) { return t.id === is_activeTab; });
    var books = state.books.filter(tab.match);
    if (books.length === 0) {
      box.appendChild(emptyMessage(is_activeTab));
      return;
    }

    var main = books.filter(function (b) { return !b.dismissed; });
    var dismissed = books.filter(function (b) { return b.dismissed; });
    var list = h('div', { class: 'cards' });
    main.forEach(function (b) { list.appendChild(bookCard(b)); });
    box.appendChild(list);

    if (dismissed.length > 0) {
      var dhead = h('div', { class: 'section-head', style: 'margin-top: 20px;' }, [
        h('h3', { text: 'Dismissed (' + dismissed.length + ')' })
      ]);
      box.appendChild(dhead);
      var dlist = h('div', { class: 'cards' });
      dismissed.forEach(function (b) { dlist.appendChild(bookCard(b)); });
      box.appendChild(dlist);
    }
  }

  function render() {
    if (!state) return;
    renderHeader();
    renderTabs();
    renderContent();
    restoreCreateFocus();
    if (!progressTimer) renderProgress(state.progress);
  }

  // the 8s loadState poll rebuilds every card from scratch; hand focus + caret back to the
  // create-form input the user was typing in (values themselves live in createStore drafts)
  function restoreCreateFocus() {
    if (!createFocus) return;
    var ae = document.activeElement;
    if (ae && ae !== document.body && ae.tagName !== 'HTML') { createFocus = null; return; }
    var sel = '.create-wrap[data-book-key=' + JSON.stringify(createFocus.key) +
      '] input[name=' + JSON.stringify(createFocus.name) + ']';
    var el = document.querySelector(sel);
    createFocus = null;
    if (!el) return;
    el.focus();
    try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* non-text input */ }
  }

  async function withBusy(fn) {
    if (busy) return;
    busy = true;
    render();
    startProgressPolling();
    try {
      await fn();
    } catch (e) {
      toast(e.message || String(e));
    } finally {
      busy = false;
      finishProgressPolling();
      debounceRefresh();
    }
  }

  async function pickCandidate(book, cand) {
    await withBusy(async function () {
      var key = encodeURIComponent(book.key);
      await api('/api/book/' + key + '/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId: cand.id })
      });
    });
  }

  async function dismiss(book) {
    await withBusy(async function () {
      var key = encodeURIComponent(book.key);
      await api('/api/book/' + key + '/dismiss', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
    });
  }

  async function undoDismiss(book) {
    await withBusy(async function () {
      var key = encodeURIComponent(book.key);
      await api('/api/book/' + key + '/dismiss', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ undo: true })
      });
    });
  }

  async function createProduct(book, form) {
    await withBusy(async function () {
      var data = {};
      ['title', 'author', 'mrp', 'isbn'].forEach(function (n) {
        data[n] = form.elements[n].value.trim();
      });
      if (data.mrp === '') data.mrp = null;
      var key = encodeURIComponent(book.key);
      var res = await api('/api/book/' + key + '/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res && res.catalogueError) toast('product created, but catalogue snapshot not updated: ' + res.catalogueError);
      var st = createStore[book.key];
      if (st) st.draft = {};
      createFocus = null;
    });
  }

  async function retryFailed() {
    await withBusy(async function () {
      await api('/api/retry', { method: 'POST' });
    });
  }

  function renderCommitResults(results) {
    var box = document.getElementById('commit-results');
    box.innerHTML = '';
    box.hidden = false;
    var okCount = results.filter(function (r) { return !r.error; }).length;
    box.appendChild(h('h3', { text: 'Commit results — ' + okCount + ' succeeded, ' + (results.length - okCount) + ' failed' }));
    results.forEach(function (r) {
      var row = h('div', { class: 'result-row' });
      var book = state.books[r.key];
      row.appendChild(h('span', { class: r.error ? 'err' : 'ok', text: r.error ? '✗' : '✓' }));
      row.appendChild(h('span', { text: (book && book.title) || r.key }));
      if (r.error) row.appendChild(h('span', { class: 'detail', text: r.error }));
      box.appendChild(row);
    });
  }

  async function commitAll() {
    await withBusy(async function () {
      var data = await api('/api/commit', { method: 'POST' });
      renderCommitResults(data.results || []);
    });
  }

  document.getElementById('btn-commit').addEventListener('click', commitAll);
  document.getElementById('progress-dismiss').addEventListener('click', function () {
    progressDismissed = true;
    renderProgress(null);
  });
  document.getElementById('btn-refresh').addEventListener('click', function () {
    loadState();
  });
  document.getElementById('btn-change-folder').addEventListener('click', function () {
    choosingFolder = true;
    document.getElementById('folder-picker').hidden = false;
    initBrowser(state && state.folder ? state.folder : '/Users/pratulwadhwa/Documents/Workspace/VarietyBookHouse');
  });
  document.getElementById('btn-open-path').addEventListener('click', function () {
    var input = document.getElementById('folder-path-input').value.trim();
    if (input) initBrowser(input);
  });
  document.getElementById('btn-start-path').addEventListener('click', function () {
    var input = document.getElementById('folder-path-input').value.trim();
    if (input) startJob(input);
  });
  document.getElementById('folder-path-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var input = document.getElementById('folder-path-input').value.trim();
      if (input) initBrowser(input);
    }
  });
  document.getElementById('btn-go-up').addEventListener('click', function () {
    if (browserPath !== pathRoot()) {
      initBrowser(pathDirname(browserPath));
    }
  });

  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    pollProgress();
    if (progressBusy && !progressTimer) startProgressPolling();
  }, 3000);

  setInterval(function () {
    if (document.visibilityState === 'visible' && !busy) loadState();
  }, 8000);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !busy && Date.now() - lastUpdated > 2000) loadState();
  });

  loadState();
})();
</script>
</body>
